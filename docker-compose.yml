services:
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - path: ./server/.env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: "8788"
      TRUST_PROXY: "1"
    expose:
      - "8788"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8788/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

  web:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_HOST:-127.0.0.1}:${WEB_PORT:-8086}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
